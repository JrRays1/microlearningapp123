<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — CMA Micro-Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161a1f;
    --paper:#f6f3ec;
    --panel:#1e242c;
    --panel-2:#252d37;
    --gold:#c9a24b;
    --gold-dim:#8a7238;
    --green:#5f9a72;
    --red:#c25c4f;
    --line:#333c47;
    --muted:#8b93a1;
    --white:#f2efe6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:980px; margin:0 auto; padding:32px 20px 80px;}

  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:28px;
    flex-wrap:wrap; gap:12px;
  }
  .brand{
    font-family:'Fraunces',serif; font-weight:600; font-size:28px;
    letter-spacing:-0.01em;
  }
  .brand span{color:var(--gold);}
  .tagline{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px;}
  .stats{display:flex; gap:24px; font-family:'IBM Plex Mono',monospace;}
  .stat{text-align:right;}
  .stat .n{font-size:22px; color:var(--gold); font-weight:600;}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em;}

  .board{max-width:720px; margin:0 auto; height:calc(100vh - 220px); min-height:400px;}
  @media (max-width:760px){ .board{height:auto;} .panel{height:auto; overflow-y:visible;} }

  .subject-pill{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink); background:var(--gold); padding:4px 10px; border-radius:20px;
    margin-bottom:14px; font-weight:600;
  }
  .progress-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:32px; height:100%; overflow-y:auto;}
  .lesson-cat{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px;}
  .lesson-title{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin-bottom:20px; line-height:1.25;}
  .lesson-body p{font-size:18px; line-height:1.8; color:#d7d9dd; margin-bottom:18px;}
  .lesson-body strong{color:var(--gold);}

  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:uppercase; letter-spacing:0.06em;
    background:var(--gold); color:var(--ink); border:none; padding:14px 22px; border-radius:4px;
    cursor:pointer; font-weight:600; margin-top:10px;
  }
  .btn:hover{background:#dab767;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--white);}
  .btn.ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .quiz-q{margin-bottom:26px;}
  .quiz-q .qtext{font-size:18px; margin-bottom:12px; color:var(--white); font-weight:500; line-height:1.5;}
  .opt{
    display:block; padding:13px 16px; margin-bottom:9px; border:1px solid var(--line);
    border-radius:4px; cursor:pointer; font-size:16px; color:#d7d9dd; line-height:1.5;
  }
  .opt:hover{border-color:var(--gold-dim);}
  .opt.selected{border-color:var(--gold); background:rgba(201,162,75,0.08);}
  .opt.correct{border-color:var(--green); background:rgba(95,154,114,0.12); color:var(--green);}
  .opt.wrong{border-color:var(--red); background:rgba(194,92,79,0.12); color:var(--red);}
  .opt.disabled{cursor:default;}

  .result-banner{
    font-family:'IBM Plex Mono',monospace; padding:16px; border-radius:4px; margin-bottom:20px;
    font-size:14px;
  }
  .result-banner.pass{background:rgba(95,154,114,0.12); border:1px solid var(--green); color:var(--green);}
  .result-banner.fail{background:rgba(194,92,79,0.12); border:1px solid var(--red); color:var(--red);}

  .empty{color:var(--muted); font-size:14px; text-align:center; padding:60px 20px;}
  .loading{color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .footnote{margin-top:24px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}

  .panel::-webkit-scrollbar{width:8px;}
  .panel::-webkit-scrollbar-track{background:transparent;}
  .panel::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .panel::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

  .track-toggle{display:none;} /* replaced by dashboard cards */

  .dashboard{max-width:720px; margin:0 auto;}
  .dashboard-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:600px){ .dashboard-grid{grid-template-columns:1fr;} }
  .track-card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px;
    cursor:pointer; transition:border-color 0.15s, transform 0.15s;
  }
  .track-card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .track-card .tc-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--white); margin-bottom:10px; line-height:1.3;}
  .track-card .tc-progress-bar{height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-bottom:8px;}
  .track-card .tc-progress-fill{height:100%; background:var(--gold); border-radius:3px;}
  .track-card .tc-stats{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted);}

  .back-link{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted);
    text-decoration:none; cursor:pointer; margin-bottom:16px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .back-link:hover{color:var(--gold);}

  .path-wrap{max-width:480px; margin:0 auto; padding:10px 0 30px;}
  .path-title{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--white); text-align:center; margin-bottom:6px;}
  .path-subtitle{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); text-align:center; margin-bottom:28px; text-transform:uppercase; letter-spacing:0.05em;}

  .stone-row{display:flex; align-items:center; justify-content:center; position:relative; height:78px;}
  .stone-row::before{
    content:''; position:absolute; top:-39px; left:50%; width:2px; height:78px;
    background:var(--line); z-index:0;
  }
  .stone-row:first-child::before{display:none;}
  .stone{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; z-index:1; position:relative;
    border:2px solid var(--line); background:var(--panel); color:var(--muted); flex-shrink:0;
  }
  .stone.done{background:var(--green); border-color:var(--green); color:var(--ink);}
  .stone.current{
    background:var(--gold); border-color:var(--gold); color:var(--ink); cursor:pointer;
    box-shadow:0 0 0 5px rgba(201,162,75,0.18); animation:pulse 2s infinite;
  }
  .stone.current:hover{transform:scale(1.06);}
  .stone.locked{opacity:0.5;}
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 5px rgba(201,162,75,0.18); }
    50%{ box-shadow:0 0 0 9px rgba(201,162,75,0.10); }
  }
  .stone-label{
    position:absolute; left:calc(50% + 42px); font-family:'Inter',sans-serif; font-size:13px;
    color:var(--muted); max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .stone.done ~ .stone-label, .stone-row:has(.stone.done) .stone-label{color:#a9b0ba;}
  .stone-row:has(.stone.current) .stone-label{color:var(--white); font-weight:600;}
  .path-complete-note{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold);
    margin-top:20px; padding:14px; border:1px solid var(--gold-dim); border-radius:6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Ledger<span>.</span></div>
      <div class="tagline" id="tagline">Micro-lessons</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="statStreak">0</div><div class="l">Day Streak</div></div>
      <div class="stat"><div class="n" id="statDone">0/0</div><div class="l">Completed</div></div>
      <div class="stat"><div class="n" id="statAvg">—</div><div class="l">Avg Score</div></div>
    </div>
  </header>

  <div class="dashboard" id="dashboardView" style="display:none;">
    <div class="dashboard-grid" id="dashboardGrid"></div>
  </div>

  <div class="board" id="appBoard" style="display:none;">
    <div class="panel" id="mainPanel">
      <div class="loading">Loading lessons…</div>
    </div>
  </div>

  <div id="loginScreen" style="display:none; max-width:360px; margin:60px auto;">
    <div class="panel">
      <div class="lesson-title" style="font-size:20px;">Sign in</div>
      <div id="loginError" style="color:var(--red); font-family:'IBM Plex Mono',monospace; font-size:12px; margin-bottom:12px; display:none;"></div>
      <input id="loginPassword" type="password" placeholder="Password" style="width:100%; padding:10px 12px; margin-bottom:14px; background:var(--panel-2); border:1px solid var(--line); border-radius:4px; color:var(--white); font-family:'Inter',sans-serif; font-size:14px;">
      <button class="btn" id="loginBtn" style="width:100%;">Sign in</button>
    </div>
  </div>

  <div class="footnote" id="authNote">Connecting…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ---- FIREBASE CONFIG: replace with your new project's config ----
const firebaseConfig = {
  apiKey: "AIzaSyCVnByKRq8ejYc_pFDMaPBYRSwhTP2J9lc",
  authDomain: "microlearning-286fd.firebaseapp.com",
  projectId: "microlearning-286fd",
  storageBucket: "microlearning-286fd.firebasestorage.app",
  messagingSenderId: "248005201639",
  appId: "1:248005201639:web:4d28b439bbe86efd729c42"
};

// Fixed backing account — the login screen only asks for the password.
// This must match the user you create in Firebase Authentication → Users.
const FIXED_EMAIL = "rayden@ledger.local";

let db, auth, uid = null;
let firebaseReady = false;
let firebaseConfigured = true;

function showLogin(){
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('appBoard').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'none';
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
}
function showDashboard(){
  document.getElementById('appBoard').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  document.getElementById('tagline').textContent = 'Pick a subject';
  renderDashboardGrid();
}
function showBoard(){
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('appBoard').style.display = 'block';
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      uid = user.uid;
      firebaseReady = true;
      document.getElementById('authNote').textContent = `Signed in as ${user.email}. Progress synced.`;
      showApp();
      await fetchLessons();
      await loadProgressAndRender();
      showDashboard();
    } else {
      firebaseReady = false;
      document.getElementById('authNote').textContent = 'Sign in to continue.';
      showLogin();
    }
  });
} catch (e) {
  firebaseConfigured = false;
  document.getElementById('authNote').textContent = 'Firebase is not configured — lessons live in Firestore now, so this app needs it to work.';
  showApp();
  document.getElementById('mainPanel').innerHTML = '<div class="loading">Lessons unavailable — Firebase not configured.</div>';
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

function doLogin(){
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!pw){
    errEl.textContent = 'Enter your password.';
    errEl.style.display = 'block';
    return;
  }
  signInWithEmailAndPassword(auth, FIXED_EMAIL, pw).catch(err => {
    errEl.textContent = 'Wrong password.';
    errEl.style.display = 'block';
  });
}

// ---------------- LESSON CONTENT ----------------
// Lessons now live in Firestore's "lessons" collection (uploaded via upload-lessons.mjs).
// Each lesson has a "track" field ("cma" or "mind") deciding which side it belongs to.
const TRACKS = [
  { id: 'cma', label: 'CMA · Finance · Business' },
  { id: 'mind', label: 'Philosophy & Psychology' },
  { id: 'negotiation', label: 'Negotiation · Communication · Persuasion' },
  { id: 'cfa', label: 'CFA · Investing · Macro' }
];
let ALL_LESSONS = []; // every lesson fetched, unfiltered
let currentTrack = 'cma';

// Per-track working data, rebuilt whenever the active track changes.
let LESSONS = [];
let SUBJECTS = {};
let SUBJECT_ORDER = [];

function subjectOf(lesson){
  // category looks like "CMA · Cost Management" — subject is the part before " · "
  return lesson.category.split('·')[0].trim();
}

async function fetchLessons(){
  const panel = document.getElementById('mainPanel');
  panel.innerHTML = '<div class="loading">Loading lessons…</div>';
  try {
    const snap = await getDocs(collection(db, 'lessons'));
    ALL_LESSONS = [];
    snap.forEach(d => ALL_LESSONS.push(d.data()));
    ALL_LESSONS.sort((a,b) => (a.category+a.title).localeCompare(b.category+b.title));
    rebuildTrackData(currentTrack);
  } catch (err) {
    panel.innerHTML = '<div class="loading">Could not load lessons — check your connection.</div>';
    console.error(err);
  }
}

function rebuildTrackData(trackId){
  // Lessons uploaded before the track field existed default to "cma".
  LESSONS = ALL_LESSONS.filter(l => (l.track || 'cma') === trackId);
  SUBJECTS = {};
  SUBJECT_ORDER = [];
  LESSONS.forEach(lesson => {
    const subj = subjectOf(lesson);
    if (!SUBJECTS[subj]){ SUBJECTS[subj] = []; SUBJECT_ORDER.push(subj); }
    SUBJECTS[subj].push(lesson);
  });
}

// Build the subjects/order for an arbitrary track without disturbing the currently active track's state.
function buildSubjectsFor(trackId){
  const lessons = ALL_LESSONS.filter(l => (l.track || 'cma') === trackId);
  const subjects = {};
  const order = [];
  lessons.forEach(lesson => {
    const subj = subjectOf(lesson);
    if (!subjects[subj]){ subjects[subj] = []; order.push(subj); }
    subjects[subj].push(lesson);
  });
  return { lessons, subjects, order };
}

// Simulate the full rotation order for a track from a zero-state, purely for display —
// this matches what the live cycle would traverse since both start from the same rules.
function buildFullPath(trackId){
  const { lessons, subjects, order } = buildSubjectsFor(trackId);
  if (lessons.length === 0 || order.length === 0) return [];
  const pointers = {};
  order.forEach(s => pointers[s] = 0);
  const path = [];
  const seen = new Set();
  let turn = 0;
  let guard = 0;
  while (seen.size < lessons.length && guard < lessons.length * order.length + order.length){
    guard++;
    const subj = order[turn % order.length];
    const list = subjects[subj];
    const pointer = pointers[subj] % list.length;
    const lesson = list[pointer];
    if (!seen.has(lesson.id)){
      path.push(lesson);
      seen.add(lesson.id);
    }
    pointers[subj]++;
    turn++;
  }
  return path;
}

function getTrackStats(trackId){
  const lessons = ALL_LESSONS.filter(l => (l.track || 'cma') === trackId);
  const ids = new Set(lessons.map(l => l.id));
  const doneEntries = Object.entries(progress).filter(([id, p]) => ids.has(id) && p.completed);
  return { total: lessons.length, done: doneEntries.length };
}

function renderDashboardGrid(){
  const grid = document.getElementById('dashboardGrid');
  grid.innerHTML = '';
  TRACKS.forEach(track => {
    const stats = getTrackStats(track.id);
    const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
    const card = document.createElement('div');
    card.className = 'track-card';
    card.innerHTML = `
      <div class="tc-title">${track.label}</div>
      <div class="tc-progress-bar"><div class="tc-progress-fill" style="width:${pct}%;"></div></div>
      <div class="tc-stats">${stats.done}/${stats.total} lessons complete</div>
    `;
    card.addEventListener('click', () => selectTrack(track.id));
    grid.appendChild(card);
  });
}

function renderPathView(){
  const track = TRACKS.find(t => t.id === currentTrack);
  const fullPath = buildFullPath(currentTrack);
  const doneSet = new Set(cycle.completedOrder || []);
  const current = getCurrentLesson();

  const panel = document.getElementById('mainPanel');
  if (fullPath.length === 0){
    panel.innerHTML = `
      <a class="back-link" id="backToDashboardBtn">← All subjects</a>
      <div class="empty">No lessons yet on this side. Add some and re-run the upload script.</div>
    `;
    document.getElementById('backToDashboardBtn').addEventListener('click', showDashboard);
    return;
  }

  let stonesHtml = '';
  fullPath.forEach((lesson, i) => {
    const isDone = doneSet.has(lesson.id);
    const isCurrent = current && lesson.id === current.id;
    let cls = 'locked';
    if (isCurrent) cls = 'current';
    else if (isDone) cls = 'done';
    const clickable = isCurrent ? ` id="stone-${i}"` : '';
    const num = isDone && !isCurrent ? '✓' : (i + 1);
    stonesHtml += `
      <div class="stone-row">
        <div class="stone ${cls}"${clickable}>${num}</div>
        <div class="stone-label">${lesson.title}</div>
      </div>
    `;
  });

  const allDone = doneSet.size >= fullPath.length && !current;

  panel.innerHTML = `
    <a class="back-link" id="backToDashboardBtn">← All subjects</a>
    <div class="path-wrap">
      <div class="path-title">${track.label}</div>
      <div class="path-subtitle">${doneSet.size} of ${fullPath.length} complete</div>
      ${stonesHtml}
      ${allDone ? '<div class="path-complete-note">All lessons complete — next click starts a new lap.</div>' : ''}
    </div>
  `;

  document.getElementById('backToDashboardBtn').addEventListener('click', showDashboard);
  if (current){
    const stoneEl = document.getElementById(`stone-${fullPath.findIndex(l => l.id === current.id)}`);
    if (stoneEl) stoneEl.addEventListener('click', () => renderCurrentLesson());
  }
}

function updateTagline(trackId){
  const track = TRACKS.find(t => t.id === trackId);
  document.getElementById('tagline').textContent = `${track.label} — micro-lessons`;
}

function selectTrack(trackId){
  currentTrack = trackId;
  localStorage.setItem(TRACK_LOCAL_KEY, trackId);
  rebuildTrackData(trackId);
  cycle = cycles[trackId];
  updateTagline(trackId);
  renderStats();
  showBoard();
  renderPathView();
}

// ---------------- STATE ----------------
let progress = {}; // { lessonId: { completed: bool, score: number, total: number, lastDate: 'YYYY-MM-DD' } }
let quizState = null; // { answers: [], submitted: bool }
let loggedThisVisit = false; // prevents quiz retries from double-counting toward the checkpoint trigger

// Spaced repetition: { lessonId: { interval: days, dueDate: 'YYYY-MM-DD', reps: number } }
let reviewSchedule = {};
const REVIEW_INTERVALS = [1, 3, 7, 16, 35]; // days; caps at the last value on further successes
const REVIEW_LOCAL_KEY = 'ledger_review_v1';
let reviewState = null; // { lessonId, question: {...}, submitted, selected }

// Cycle state: which subject's turn is next, and how far through each subject's list we are.
// { subjectTurn: 0, pointers: { CMA: 0, Finance: 0, Business: 0 } }
let cycles = {
  cma: { subjectTurn: 0, pointers: {} },
  mind: { subjectTurn: 0, pointers: {} },
  negotiation: { subjectTurn: 0, pointers: {} },
  cfa: { subjectTurn: 0, pointers: {} }
};
let cycle = cycles.cma; // alias to the active track's cycle object
let currentLessonId = null;

const LOCAL_KEY = 'ledger_progress_v1';
const CYCLE_LOCAL_KEY_PREFIX = 'ledger_cycle_v1_';
const TRACK_LOCAL_KEY = 'ledger_track_v1';

async function loadProgressAndRender(){
  currentTrack = localStorage.getItem(TRACK_LOCAL_KEY) || 'cma';

  if (firebaseReady && uid){
    const snap = await getDocs(collection(db, 'users', uid, 'progress'));
    progress = {};
    snap.forEach(d => progress[d.id] = d.data());

    for (const track of TRACKS){
      try {
        const cycleSnap = await getDoc(doc(db, 'users', uid, 'meta', 'cycle_' + track.id));
        if (cycleSnap.exists()) cycles[track.id] = cycleSnap.data();
      } catch(e){ /* no cycle doc yet for this track — defaults stand */ }
    }

    try {
      const reviewSnap = await getDoc(doc(db, 'users', uid, 'meta', 'reviewSchedule'));
      if (reviewSnap.exists()) reviewSchedule = reviewSnap.data();
    } catch(e){ /* no review schedule yet — defaults stand */ }
  } else {
    try{ progress = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); } catch(e){ progress = {}; }
    for (const track of TRACKS){
      try{
        const stored = JSON.parse(localStorage.getItem(CYCLE_LOCAL_KEY_PREFIX + track.id) || '');
        if (stored) cycles[track.id] = stored;
      } catch(e){ /* defaults stand */ }
    }
    try{
      const storedReview = JSON.parse(localStorage.getItem(REVIEW_LOCAL_KEY) || '');
      if (storedReview) reviewSchedule = storedReview;
    } catch(e){ /* defaults stand */ }
  }

  cycle = cycles[currentTrack];
  rebuildTrackData(currentTrack);
  renderStats();
}

async function saveReviewSchedule(){
  if (firebaseReady && uid){
    try {
      await setDoc(doc(db, 'users', uid, 'meta', 'reviewSchedule'), reviewSchedule);
    } catch (err) {
      console.error('Could not save review schedule to Firestore, falling back to local storage:', err);
      localStorage.setItem(REVIEW_LOCAL_KEY, JSON.stringify(reviewSchedule));
    }
  } else {
    localStorage.setItem(REVIEW_LOCAL_KEY, JSON.stringify(reviewSchedule));
  }
}

async function saveCycle(){
  cycles[currentTrack] = cycle; // keep the map in sync with the active alias
  if (firebaseReady && uid){
    try {
      await setDoc(doc(db, 'users', uid, 'meta', 'cycle_' + currentTrack), cycle);
    } catch (err) {
      console.error('Could not save cycle position to Firestore, falling back to local storage:', err);
      localStorage.setItem(CYCLE_LOCAL_KEY_PREFIX + currentTrack, JSON.stringify(cycle));
    }
  } else {
    localStorage.setItem(CYCLE_LOCAL_KEY_PREFIX + currentTrack, JSON.stringify(cycle));
  }
}

async function saveProgress(lessonId, data){
  progress[lessonId] = data;
  if (firebaseReady && uid){
    await setDoc(doc(db, 'users', uid, 'progress', lessonId), data);
  } else {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(progress));
  }
  renderStats();
}

function renderStats(){
  const total = LESSONS.length;
  const trackLessonIds = new Set(LESSONS.map(l => l.id));
  const doneEntries = Object.entries(progress)
    .filter(([id, p]) => trackLessonIds.has(id) && p.completed)
    .map(([id, p]) => p);
  const done = doneEntries.length;
  document.getElementById('statDone').textContent = `${done}/${total}`;

  if (doneEntries.length){
    const avg = doneEntries.reduce((s,p) => s + (p.score/p.total*100), 0) / doneEntries.length;
    document.getElementById('statAvg').textContent = Math.round(avg) + '%';
  } else {
    document.getElementById('statAvg').textContent = '—';
  }

  // streak: consecutive days with at least one completion in EITHER track, counting back from today
  const allDoneEntries = Object.values(progress).filter(p => p.completed);
  const dates = new Set(allDoneEntries.map(p => p.lastDate));
  let streak = 0;
  let d = new Date();
  while (true){
    const key = d.toISOString().slice(0,10);
    if (dates.has(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

function getCurrentLesson(){
  if (SUBJECT_ORDER.length === 0) return null;
  // find a subject with lessons remaining in the rotation, starting from subjectTurn
  for (let i = 0; i < SUBJECT_ORDER.length; i++){
    const idx = (cycle.subjectTurn + i) % SUBJECT_ORDER.length;
    const subj = SUBJECT_ORDER[idx];
    const list = SUBJECTS[subj];
    if (list && list.length > 0){
      cycle.subjectTurn = idx;
      const pointer = (cycle.pointers[subj] || 0) % list.length;
      return list[pointer];
    }
  }
  return null;
}

async function advanceCycle(){
  const subj = SUBJECT_ORDER[cycle.subjectTurn];
  const list = SUBJECTS[subj];
  const pointer = (cycle.pointers[subj] || 0) % list.length;
  cycle.pointers[subj] = pointer + 1; // moves forward; wraps via modulo next time this subject comes up
  cycle.subjectTurn = (cycle.subjectTurn + 1) % SUBJECT_ORDER.length;
  await saveCycle();
}

function renderCurrentLesson(){
  quizState = null;
  loggedThisVisit = false;
  const lesson = getCurrentLesson();
  if (!lesson){
    const track = TRACKS.find(t => t.id === currentTrack);
    document.getElementById('mainPanel').innerHTML = `<div class="empty">No lessons yet on the ${track.label} side. Add some and re-run the upload script.</div>`;
    return;
  }
  currentLessonId = lesson.id;
  renderLessonView(lesson.id);
}

function subjectProgressLabel(lesson){
  const subj = subjectOf(lesson);
  const list = SUBJECTS[subj];
  const pointer = (cycle.pointers[subj] || 0) % list.length;
  return `${subj} — lesson ${pointer + 1} of ${list.length}`;
}

function renderLessonView(id){
  const lesson = LESSONS.find(l => l.id === id);
  const panel = document.getElementById('mainPanel');
  panel.innerHTML = `
    <div class="progress-row"><span>${subjectProgressLabel(lesson)}</span><span>${lesson.category}</span></div>
    <div class="subject-pill">${subjectOf(lesson)}</div>
    <div class="lesson-title">${lesson.title}</div>
    <div class="lesson-body">${lesson.body.map(p => `<p>${p}</p>`).join('')}</div>
    <button class="btn" id="startQuizBtn">Take the quiz →</button>
  `;
  document.getElementById('startQuizBtn').addEventListener('click', () => startQuiz(id));
}

function startQuiz(id){
  const lesson = LESSONS.find(l => l.id === id);
  quizState = { answers: new Array(lesson.quiz.length).fill(null), submitted: false };
  renderQuizView(id);
}

function renderQuizView(id){
  const lesson = LESSONS.find(l => l.id === id);
  const panel = document.getElementById('mainPanel');
  let html = `
    <div class="subject-pill">${subjectOf(lesson)}</div>
    <div class="lesson-title">${lesson.title} — Quiz</div>
  `;
  lesson.quiz.forEach((q, qi) => {
    html += `<div class="quiz-q"><div class="qtext">${qi+1}. ${q.q}</div>`;
    q.options.forEach((opt, oi) => {
      let cls = 'opt';
      if (quizState.submitted){
        cls += ' disabled';
        if (oi === q.correct) cls += ' correct';
        else if (quizState.answers[qi] === oi) cls += ' wrong';
      } else if (quizState.answers[qi] === oi){
        cls += ' selected';
      }
      html += `<div class="${cls}" data-qi="${qi}" data-oi="${oi}">${opt}</div>`;
    });
    html += `</div>`;
  });

  if (!quizState.submitted){
    html += `<button class="btn" id="submitQuizBtn">Submit answers</button> <button class="btn ghost" id="backToLessonBtn">← Back to passage</button>`;
  } else {
    const score = quizState.answers.filter((a, i) => a === lesson.quiz[i].correct).length;
    const total = lesson.quiz.length;
    const pct = Math.round(score/total*100);
    const pass = pct >= 70;
    html = `<div class="result-banner ${pass ? 'pass' : 'fail'}">${score}/${total} correct (${pct}%) — ${pass ? 'Passed.' : 'Below 70% — review and retry if you want, or move on.'}</div>` + html;
    html += `<button class="btn ghost" id="retryQuizBtn">Retry quiz</button> <button class="btn" id="nextBtn">Next lesson →</button>`;
  }

  panel.innerHTML = html;

  if (!quizState.submitted){
    panel.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const qi = parseInt(el.dataset.qi);
        const oi = parseInt(el.dataset.oi);
        quizState.answers[qi] = oi;
        renderQuizView(id);
      });
    });
    const submitBtn = document.getElementById('submitQuizBtn');
    submitBtn.disabled = quizState.answers.includes(null);
    submitBtn.addEventListener('click', () => submitQuiz(id));
    document.getElementById('backToLessonBtn').addEventListener('click', () => {
      quizState = null;
      renderLessonView(id);
    });
  } else {
    document.getElementById('retryQuizBtn').addEventListener('click', () => startQuiz(id));
    document.getElementById('nextBtn').addEventListener('click', () => goToNext());
  }
}

async function submitQuiz(id){
  const lesson = LESSONS.find(l => l.id === id);
  quizState.submitted = true;
  const score = quizState.answers.filter((a, i) => a === lesson.quiz[i].correct).length;
  const total = lesson.quiz.length;
  const today = new Date().toISOString().slice(0,10);
  await saveProgress(id, { completed: score/total >= 0.7, score, total, lastDate: today });

  if (!loggedThisVisit){
    if (!cycle.completedOrder) cycle.completedOrder = [];
    cycle.completedOrder.push(id);
    await saveCycle();
    loggedThisVisit = true;

    // Schedule the first spaced-repetition review for tomorrow
    reviewSchedule[id] = { interval: REVIEW_INTERVALS[0], dueDate: addDays(new Date(), REVIEW_INTERVALS[0]), reps: 0 };
    await saveReviewSchedule();
  }

  renderQuizView(id);
}

// ---------------- CHECKPOINT (every 5 completions) ----------------
let checkpointState = null; // { questions: [...], answers: [], submitted: bool }

function checkpointDue(){
  const count = (cycle.completedOrder || []).length;
  const seen = cycle.checkpointsSeen || 0;
  return Math.floor(count / 5) > seen;
}

function addDays(date, days){
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function getDueReviewId(){
  const trackLessonIds = new Set(LESSONS.map(l => l.id));
  const today = todayStr();
  const due = Object.entries(reviewSchedule)
    .filter(([id, r]) => trackLessonIds.has(id) && r.dueDate <= today)
    .sort((a,b) => a[1].dueDate.localeCompare(b[1].dueDate));
  return due.length ? due[0][0] : null;
}

function goToNext(){
  if (checkpointDue()){
    startCheckpoint();
    return;
  }
  const dueId = getDueReviewId();
  if (dueId){
    startReview(dueId);
    return;
  }
  advanceAndRenderNext();
}

async function advanceAndRenderNext(){
  try {
    await advanceCycle();
  } catch (err) {
    console.error('advanceCycle failed, continuing anyway:', err);
  }
  renderCurrentLesson();
}

// ---- Adaptive difficulty: rolling accuracy across the last 8 reviews, per track ----
function getRollingAccuracy(){
  const results = (reviewSchedule.__meta && reviewSchedule.__meta[currentTrack]) || [];
  if (results.length < 4) return null; // not enough data yet — use medium difficulty by default
  const correct = results.filter(r => r).length;
  return correct / results.length;
}

function recordReviewResult(wasCorrect){
  if (!reviewSchedule.__meta) reviewSchedule.__meta = {};
  if (!reviewSchedule.__meta[currentTrack]) reviewSchedule.__meta[currentTrack] = [];
  const arr = reviewSchedule.__meta[currentTrack];
  arr.push(wasCorrect);
  if (arr.length > 8) arr.shift(); // keep only the most recent 8
}

function getDifficultyTier(){
  const acc = getRollingAccuracy();
  if (acc === null) return 'medium';
  if (acc < 0.6) return 'easy';
  if (acc > 0.85) return 'hard';
  return 'medium';
}

function startReview(lessonId){
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson || !lesson.checkpoint){
    advanceAndRenderNext();
    return;
  }
  const tier = getDifficultyTier();
  let questions;
  if (tier === 'easy' && lesson.quiz && lesson.quiz.length){
    questions = [lesson.quiz[0]];
  } else if (tier === 'hard'){
    // Chain the checkpoint with a second question from a different lesson on this track,
    // forcing two concepts to be held active at once.
    const other = LESSONS.filter(l => l.id !== lessonId && l.checkpoint);
    const secondQ = other.length ? other[Math.floor(Math.random() * other.length)] : null;
    questions = secondQ ? [lesson.checkpoint, secondQ.checkpoint] : [lesson.checkpoint];
    reviewState = { lessonId, questions, current: 0, results: [], selected: null, submitted: false,
      lessonTitle: lesson.title, secondTitle: secondQ ? secondQ.title : null, tier };
    renderReviewView();
    return;
  } else {
    questions = [lesson.checkpoint];
  }
  reviewState = { lessonId, questions, current: 0, results: [], selected: null, submitted: false,
    lessonTitle: lesson.title, secondTitle: null, tier };
  renderReviewView();
}

function renderReviewView(){
  const panel = document.getElementById('mainPanel');
  const q = reviewState.questions[reviewState.current];
  const isSecond = reviewState.current === 1;
  const tierLabel = reviewState.tier === 'hard' ? 'Spaced review — harder' : reviewState.tier === 'easy' ? 'Spaced review — warm-up' : 'Spaced review';
  let html = `
    <div class="subject-pill" style="background:var(--gold-dim); color:var(--white);">${tierLabel}</div>
    <div class="lesson-title">${isSecond ? reviewState.secondTitle : reviewState.lessonTitle}</div>
    <div class="lesson-body"><p>No re-reading first — try to recall the answer from memory.${reviewState.questions.length > 1 ? ' (Question ' + (reviewState.current+1) + ' of ' + reviewState.questions.length + ')' : ''}</p></div>
    <div class="quiz-q"><div class="qtext">${q.q}</div>
  `;
  q.options.forEach((opt, oi) => {
    let cls = 'opt';
    if (reviewState.submitted){
      cls += ' disabled';
      if (oi === q.correct) cls += ' correct';
      else if (reviewState.selected === oi) cls += ' wrong';
    } else if (reviewState.selected === oi){
      cls += ' selected';
    }
    html += `<div class="${cls}" data-oi="${oi}">${opt}</div>`;
  });
  html += `</div>`;

  if (!reviewState.submitted){
    html += `<button class="btn" id="submitReviewBtn" ${reviewState.selected === null ? 'disabled' : ''}>Submit</button>`;
  } else {
    const correct = reviewState.selected === q.correct;
    const isLast = reviewState.current === reviewState.questions.length - 1;
    html = `<div class="result-banner ${correct ? 'pass' : 'fail'}">${correct ? 'Correct — recall reinforced.' : 'Not quite — this will come back around sooner.'}</div>` + html;
    html += `<button class="btn" id="reviewContinueBtn">${isLast ? 'Continue →' : 'Next question →'}</button>`;
  }

  panel.innerHTML = html;

  if (!reviewState.submitted){
    panel.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        reviewState.selected = parseInt(el.dataset.oi);
        renderReviewView();
      });
    });
    const btn = document.getElementById('submitReviewBtn');
    if (btn) btn.addEventListener('click', () => {
      reviewState.submitted = true;
      renderReviewView();
    });
  } else {
    document.getElementById('reviewContinueBtn').addEventListener('click', async () => {
      const wasCorrect = reviewState.selected === q.correct;
      reviewState.results.push(wasCorrect);
      if (reviewState.current < reviewState.questions.length - 1){
        reviewState.current++;
        reviewState.selected = null;
        reviewState.submitted = false;
        renderReviewView();
      } else {
        await finishReview(reviewState.results);
      }
    });
  }
}

async function finishReview(results){
  const id = reviewState.lessonId;
  // Overall pass requires getting the primary (first) question right — the chained
  // second question in hard mode still counts toward rolling accuracy, but doesn't
  // by itself reset the lesson's own interval.
  const wasCorrect = results[0];
  results.forEach(r => recordReviewResult(r));

  const current = reviewSchedule[id] || { interval: REVIEW_INTERVALS[0], reps: 0 };
  if (wasCorrect){
    const nextIdx = Math.min(current.reps + 1, REVIEW_INTERVALS.length - 1);
    const nextInterval = REVIEW_INTERVALS[nextIdx];
    reviewSchedule[id] = { interval: nextInterval, dueDate: addDays(new Date(), nextInterval), reps: current.reps + 1 };
  } else {
    reviewSchedule[id] = { interval: REVIEW_INTERVALS[0], dueDate: addDays(new Date(), REVIEW_INTERVALS[0]), reps: 0 };
  }
  await saveReviewSchedule();
  reviewState = null;
  goToNext(); // check for further due reviews before finally advancing rotation
}

function startCheckpoint(){
  const last5Ids = cycle.completedOrder.slice(-5);
  const questions = last5Ids
    .map(id => LESSONS.find(l => l.id === id))
    .filter(l => l && l.checkpoint)
    .map(l => ({ ...l.checkpoint, sourceTitle: l.title }));
  checkpointState = { questions, answers: new Array(questions.length).fill(null), submitted: false };
  renderCheckpointView();
}

function renderCheckpointView(){
  const panel = document.getElementById('mainPanel');
  let html = `
    <div class="subject-pill" style="background:var(--green); color:var(--ink);">Checkpoint review</div>
    <div class="lesson-title">Mixed review — last 5 lessons</div>
    <div class="lesson-body"><p>Quick check across what you've just covered, mixed together. This isn't a repeat of the lesson quizzes — it applies the concepts.</p></div>
  `;
  checkpointState.questions.forEach((q, qi) => {
    html += `<div class="quiz-q"><div class="qtext">${qi+1}. (${q.sourceTitle}) ${q.q}</div>`;
    q.options.forEach((opt, oi) => {
      let cls = 'opt';
      if (checkpointState.submitted){
        cls += ' disabled';
        if (oi === q.correct) cls += ' correct';
        else if (checkpointState.answers[qi] === oi) cls += ' wrong';
      } else if (checkpointState.answers[qi] === oi){
        cls += ' selected';
      }
      html += `<div class="${cls}" data-qi="${qi}" data-oi="${oi}">${opt}</div>`;
    });
    html += `</div>`;
  });

  if (!checkpointState.submitted){
    html += `<button class="btn" id="submitCheckpointBtn">Submit review</button>`;
  } else {
    const score = checkpointState.answers.filter((a,i) => a === checkpointState.questions[i].correct).length;
    const total = checkpointState.questions.length;
    const pct = total ? Math.round(score/total*100) : 0;
    const pass = pct >= 70;
    html = `<div class="result-banner ${pass ? 'pass' : 'fail'}">${score}/${total} correct (${pct}%) on this checkpoint.</div>` + html;
    html += `<button class="btn" id="checkpointContinueBtn">Continue →</button>`;
  }

  panel.innerHTML = html;

  if (!checkpointState.submitted){
    panel.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const qi = parseInt(el.dataset.qi);
        const oi = parseInt(el.dataset.oi);
        checkpointState.answers[qi] = oi;
        renderCheckpointView();
      });
    });
    const submitBtn = document.getElementById('submitCheckpointBtn');
    submitBtn.disabled = checkpointState.answers.includes(null);
    submitBtn.addEventListener('click', () => {
      checkpointState.submitted = true;
      renderCheckpointView();
    });
  } else {
    document.getElementById('checkpointContinueBtn').addEventListener('click', async () => {
      cycle.checkpointsSeen = Math.floor((cycle.completedOrder || []).length / 5);
      await saveCycle();
      checkpointState = null;
      goToNext();
    });
  }
}

// initial paint happens once auth resolves and lessons are fetched
renderStats();
</script>
